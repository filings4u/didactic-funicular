<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration | screenings4u Management Portal</title>

    <link rel="stylesheet" href="assets/css/admin-lms.css">
</head>

<body>

    <div class="admin-lms-app">

        <!-- Sidebar is rendered by admin-lms-sidebar.js -->
        <div id="admin-lms-sidebar-target"></div>

        <main class="admin-lms-main">

            <!-- =====================================================
                 TOPBAR
            ====================================================== -->
            <header class="admin-lms-topbar">

<div class="admin-lms-topbar-left">

    <button
        type="button"
        class="admin-lms-sidebar-collapse"
        data-admin-sidebar-collapse
        aria-label="Collapse sidebar"
        aria-expanded="true"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
    </button>

    <div class="admin-lms-page-context">
        <small>screenings4u Management Portal</small>
        <strong>Administration</strong>
    </div>

</div>


                <div class="admin-lms-topbar-right">

                    <a
                        href="admin-notifications.html"
                        class="admin-lms-icon-button"
                        aria-label="Notifications"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                            <path d="M10 21h4"/>
                        </svg>
                    </a>


<div class="admin-user-dropdown">

    <button
        type="button"
        class="admin-user-dropdown-toggle"
        data-admin-user-menu-toggle
        aria-expanded="false"
    >

        <span class="admin-lms-avatar">
            AD
        </span>

        <span class="admin-lms-user-copy">

            <span class="admin-lms-user-name">
                Administrator
            </span>

            <span class="admin-lms-user-role">
                System Administrator
            </span>

        </span>

        <span class="admin-user-dropdown-chevron">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6"></path>
            </svg>
        </span>

    </button>


    <div
        class="admin-user-dropdown-menu"
        data-admin-user-menu
    >

        <div class="admin-user-dropdown-header">

            <strong>Administrator</strong>

            <span>
                System Administrator
            </span>

        </div>


        <a
            href="../index.html"
            class="admin-user-dropdown-item"
        >

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3a14 14 0 0 1 0 18"></path>
                <path d="M12 3a14 14 0 0 0 0 18"></path>
            </svg>

            <span>Visit Main Website</span>

        </a>


        <a
            href="admin-account-access.html"
            class="admin-user-dropdown-item"
        >

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c1-4.5 3.7-7 8-7s7 2.5 8 7"></path>
            </svg>

            <span>Account Access</span>

        </a>


        <a
            href="admin-accounts.html"
            class="admin-user-dropdown-item"
        >

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 19V5h16v14z"></path>
                <path d="M8 9h8M8 13h5"></path>
            </svg>

            <span>My Account</span>

        </a>


        <div class="admin-user-dropdown-divider"></div>


        <button
            type="button"
            class="admin-user-dropdown-item admin-user-logout"
            data-admin-logout
        >

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M21 19V5"></path>
            </svg>

            <span>Logout</span>

        </button>

    </div>

</div>

            </header>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/core-auth.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/session-security.js"></script>
<script src="assets/js/portal-auth-guard.js"></script>
<script src="assets/js/admin-auth-guard.js"></script>
<script src="assets/js/admin-lms-sidebar.js"></script>
<script src="assets/js/admin-dashboard.js"></script>

</body>
</html>
