<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#325aa3" />

<title>Quote Builder | screenings4u Management Portal</title>
<link rel="icon" type="image/png" href="images/fav.png">
<link rel="stylesheet" href="assets/css/admin-lms.css">
<style>
:root{--b:#173d78;--o:#ff6b00;--t:#273348;--m:#6f7b8d;--l:#dfe5ec;--bg:#f5f7fa;--g:#18794e;--r:#b42318}
*{box-sizing:border-box}.page{padding:28px;background:var(--bg);min-height:calc(100vh - 72px);color:var(--t)}
.heading,.actions,.tot{display:flex;align-items:center}.heading{justify-content:space-between;gap:20px;margin-bottom:18px}
.kicker{display:block;color:var(--o);font:900 10px Arial;letter-spacing:.12em}.heading h1{margin:4px 0 6px;color:var(--b);font-size:32px}.heading p{margin:0;color:var(--m);font-size:10px;line-height:1.5}
.actions{gap:8px;flex-wrap:wrap}.btn{min-height:38px;padding:0 14px;border:1px solid #cfd7e2;border-radius:7px;background:#fff;color:var(--b);font:800 10px Arial;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.btn.orange{background:var(--o);border-color:var(--o);color:#fff}.btn.danger{color:var(--r)}.btn:disabled{opacity:.45}
.message{display:none;margin-bottom:14px;padding:11px 13px;border-radius:7px;font:800 10px Arial}.message.show{display:block}.message.error{background:#fff5f5;border:1px solid #fed7d7;color:var(--r)}.message.ok{background:#edf8f2;border:1px solid #cce8d9;color:var(--g)}
.builder{max-width:1180px;margin:0 auto}.section{background:#fff;border:1px solid var(--l);border-radius:9px;padding:18px;margin-bottom:14px}.section h3{margin:0 0 14px;color:var(--b);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:grid;gap:5px}.field.w2{grid-column:span 2}.field.full{grid-column:1/-1}.field label{color:var(--b);font-size:8px;font-weight:900;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;border:1px solid #d4dce6;border-radius:7px;background:#fff;padding:9px 10px;font-size:10px}.field input,.field select{height:39px}.field textarea{min-height:90px;resize:vertical}.invalid{border-color:#d92d20!important}
.catalog{display:grid;grid-template-columns:minmax(260px,1fr) 130px 80px 110px 85px;gap:8px;align-items:end}
.table-wrap{overflow-x:auto}.items{width:100%;min-width:820px;border-collapse:collapse;margin-top:14px}.items th,.items td{padding:9px 6px;border-bottom:1px solid #e8edf2;font-size:8px;text-align:left}.items input{height:31px;width:86px;border:1px solid #d4dce6;border-radius:5px;padding:5px}.items input.desc{width:100%;min-width:220px}.remove{border:0;background:none;color:var(--r);font-size:8px;font-weight:900;cursor:pointer}
.summary{margin:14px 0 0 auto;width:min(350px,100%)}.tot{justify-content:space-between;padding:6px 0;font-size:9px}.tot.total{border-top:1px solid var(--l);padding-top:10px;margin-top:5px;color:var(--b);font-size:15px;font-weight:900}
.footer{position:sticky;bottom:0;z-index:5;background:rgba(245,247,250,.96);border-top:1px solid var(--l);padding:14px 0;display:flex;justify-content:space-between;gap:12px;backdrop-filter:blur(8px)}
@media(max-width:900px){.grid{grid-template-columns:1fr}.field.w2,.field.full{grid-column:auto}.catalog{grid-template-columns:1fr 1fr}.footer{position:static}}
@media(max-width:650px){.page{padding:18px}.heading,.footer{flex-direction:column;align-items:stretch}.catalog{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="admin-lms-app"><div id="admin-lms-sidebar-target"></div><main class="admin-lms-main">
<header class="admin-lms-topbar"><div class="admin-lms-topbar-left"><button type="button" class="admin-lms-sidebar-collapse" data-admin-sidebar-collapse aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg></button><div class="admin-lms-page-context"><small>SALES & OPERATIONS</small><strong>Quote Builder</strong></div></div></header>
<section class="page"><div class="builder">
<header class="heading"><div><span class="kicker">QUOTE BUILDER</span><h1 id="pageTitle">New Quote</h1><p>Create or manage the complete quote on a dedicated page.</p></div><div class="actions"><a class="btn" href="admin-quotes.html">← Back to Quotes</a></div></header>
<div class="message" id="formMessage"></div>

<section class="section"><h3>Recipient & Quote</h3><div class="grid">
<div class="field"><label>Recipient Type</label><select id="recipientType"><option value="customer">Customer</option><option value="employer">Employer</option></select></div>
<div class="field w2"><label>Existing Recipient</label><select id="recipient"></select></div>
<div class="field"><label>Customer / Contact Name *</label><input id="customerName"></div>
<div class="field"><label>Email *</label><input id="customerEmail" type="email"></div>
<div class="field"><label>Valid Until</label><input id="validUntil" type="date"></div>
<div class="field full"><label>Quote Title *</label><input id="title" placeholder="DOT Drug & Alcohol Testing Services"></div>
<div class="field full"><label>Introduction</label><textarea id="introduction" placeholder="Thank you for the opportunity to provide this quote..."></textarea></div>
</div></section>

<section class="section"><h3>Services & Pricing</h3>
<div class="catalog"><div class="field"><label>Service</label><select id="service"></select></div><div class="field"><label>Price</label><input id="price" type="number" min="0" step=".01"></div><div class="field"><label>Qty</label><input id="qty" type="number" min=".01" step=".01" value="1"></div><div class="field"><label>Discount</label><input id="discount" type="number" min="0" step=".01" value="0"></div><button class="btn primary" id="addItem">Add</button></div>
<div class="table-wrap"><table class="items"><thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Discount</th><th>Tax %</th><th>Total</th><th></th></tr></thead><tbody id="items"></tbody></table></div>
<div class="summary"><div class="tot"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div><div class="tot"><span>Discount</span><strong id="discountTotal">$0.00</strong></div><div class="tot"><span>Tax</span><strong id="taxTotal">$0.00</strong></div><div class="tot total"><span>Total</span><strong id="total">$0.00</strong></div></div>
</section>

<section class="section"><h3>Terms & Notes</h3><div class="grid"><div class="field full"><label>Terms</label><textarea id="terms" placeholder="Pricing, payment, scheduling, cancellation, and validity terms..."></textarea></div><div class="field full"><label>Internal Notes</label><textarea id="notes"></textarea></div></div></section>

<footer class="footer"><div class="actions"><button class="btn danger" id="cancelQuote" hidden>Cancel Quote</button><button class="btn" id="duplicate" hidden>Duplicate</button><button class="btn" id="convert" hidden>Convert to Order</button></div><div class="actions"><button class="btn" id="save">Save Draft</button><button class="btn orange" id="send">Save & Send Quote</button></div></footer>
</div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/core-auth.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/session-security.js"></script>
<script src="assets/js/portal-auth-guard.js"></script>
<script src="assets/js/admin-auth-guard.js"></script>
<script src="assets/js/admin-lms-sidebar.js"></script>
<script src="assets/js/admin-quote.js?v=20260829-2145"></script>
</body></html>
