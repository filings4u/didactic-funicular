<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FAQ Management | screenings4u Management Portal</title>
  <link rel="icon" type="image/png" href="images/fav.png">
  <link rel="stylesheet" href="assets/css/admin-lms.css">
  <style>
    .faq-admin-page{padding:30px}.faq-admin-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.faq-admin-header small{color:#ff6b00;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.faq-admin-header h1{margin:7px 0 5px;color:#10284b;font-size:34px;letter-spacing:-.04em}.faq-admin-header p{margin:0;color:#667892;font-size:13px}.faq-primary{min-height:42px;padding:0 17px;border:0;border-radius:8px;background:#ff6b00;color:#fff;font-weight:800;cursor:pointer}.faq-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.faq-stat{padding:18px;border:1px solid #d9e3f0;border-radius:12px;background:#fff}.faq-stat span{display:block;color:#667892;font-size:10px;font-weight:800;text-transform:uppercase}.faq-stat strong{display:block;margin-top:8px;color:#10284b;font-size:27px}.faq-panel{overflow:hidden;border:1px solid #d9e3f0;border-radius:14px;background:#fff;box-shadow:0 8px 25px rgba(23,51,95,.07)}.faq-toolbar{display:grid;grid-template-columns:1fr 200px;gap:12px;padding:16px;border-bottom:1px solid #d9e3f0;background:#f4f7fc}.faq-toolbar input,.faq-toolbar select{min-height:42px;padding:0 12px;border:1px solid #c4d3e5;border-radius:8px;background:#fff;color:#1d2d45;font:inherit}.faq-admin-rows{display:grid}.faq-admin-row{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:18px;align-items:center;padding:17px 18px;border-bottom:1px solid #d9e3f0}.faq-admin-row:last-child{border:0}.faq-admin-main{min-width:0}.faq-admin-category{display:block;margin-bottom:4px;color:#d95800;font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.faq-admin-main strong{display:block;overflow:hidden;color:#17335f;font-size:13px;text-overflow:ellipsis;white-space:nowrap}.faq-admin-main small{display:block;margin-top:5px;color:#667892;font-size:10px}.faq-status{display:inline-flex;justify-content:center;padding:6px 9px;border-radius:999px;background:#eef3f9;color:#667892;font-size:9px;font-weight:900;text-transform:uppercase}.faq-status.published{background:#e8eff9;color:#24467f}.faq-status.review{background:#fff0e6;color:#d95800}.faq-admin-actions{display:flex;gap:6px}.faq-row-button{min-height:34px;padding:0 10px;border:1px solid #c4d3e5;border-radius:7px;background:#fff;color:#24467f;font-size:10px;font-weight:800;cursor:pointer}.faq-row-button.danger{border-color:#f2c8c8;color:#b42318}.faq-admin-empty,.faq-admin-loading{padding:35px;text-align:center;color:#667892}.faq-modal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(16,40,75,.58)}.faq-modal.open{display:flex}.faq-modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:15px;background:#fff;box-shadow:0 28px 70px rgba(23,51,95,.24)}.faq-modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid #d9e3f0}.faq-modal-header h2{margin:0;color:#10284b;font-size:20px}.faq-close{width:36px;height:36px;border:0;border-radius:8px;background:#f4f7fc;color:#24467f;font-size:22px;cursor:pointer}.faq-form{padding:21px}.faq-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.faq-field{display:grid;gap:6px}.faq-field.full{grid-column:1/-1}.faq-field label{color:#24467f;font-size:10px;font-weight:800;text-transform:uppercase}.faq-field input,.faq-field select,.faq-field textarea{width:100%;padding:11px;border:1px solid #c4d3e5;border-radius:8px;background:#fff;color:#1d2d45;font:inherit;font-size:12px}.faq-field textarea{min-height:145px;resize:vertical}.faq-checks{display:flex;flex-wrap:wrap;gap:15px;padding:13px;border-radius:9px;background:#f4f7fc}.faq-checks label{display:flex;align-items:center;gap:7px;color:#1d2d45;font-size:11px;font-weight:700;text-transform:none}.faq-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}.faq-cancel{min-height:40px;padding:0 15px;border:1px solid #c4d3e5;border-radius:8px;background:#fff;color:#24467f;font-weight:800;cursor:pointer}@media(max-width:900px){.faq-stats{grid-template-columns:1fr 1fr}.faq-admin-row{grid-template-columns:1fr auto}.faq-status{grid-column:2}.faq-admin-actions{grid-column:1/-1}}@media(max-width:600px){.faq-admin-page{padding:20px 14px}.faq-admin-header{align-items:stretch;flex-direction:column}.faq-admin-header h1{font-size:29px}.faq-toolbar,.faq-form-grid{grid-template-columns:1fr}.faq-field.full{grid-column:auto}.faq-admin-row{grid-template-columns:1fr}.faq-status{grid-column:auto;justify-self:start}.faq-admin-actions{grid-column:auto;flex-wrap:wrap}}
  </style>
</head>
<body>
  <div class="admin-lms-app"><div id="admin-lms-sidebar-target"></div><main class="admin-lms-main"><header class="admin-lms-topbar"><div class="admin-lms-topbar-left"><button type="button" class="admin-lms-sidebar-collapse" data-admin-sidebar-collapse aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg></button><div class="admin-lms-page-context"><small>screenings4u Management Portal</small><strong>FAQ Management</strong></div></div><div class="admin-lms-topbar-right"><a href="faqs.html" target="_blank" class="admin-lms-icon-button" aria-label="View public FAQ page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></a></div></header>
    <section class="faq-admin-page"><div class="faq-admin-header"><div><small>Website Content</small><h1>Frequently Asked Questions</h1><p>Create, publish, organize, and control where FAQ answers appear.</p></div><button type="button" class="faq-primary" id="addFaqButton">+ Create FAQ</button></div>
      <div class="faq-stats"><div class="faq-stat"><span>Total FAQs</span><strong id="faqStatTotal">0</strong></div><div class="faq-stat"><span>Published</span><strong id="faqStatPublished">0</strong></div><div class="faq-stat"><span>Draft / Review</span><strong id="faqStatDraft">0</strong></div><div class="faq-stat"><span>Featured</span><strong id="faqStatFeatured">0</strong></div></div>
      <div class="faq-panel"><div class="faq-toolbar"><input id="faqAdminSearch" type="search" placeholder="Search question, category, or tag..."><select id="faqAdminStatus"><option value="all">All statuses</option><option value="published">Published</option><option value="draft">Draft</option><option value="review">Review</option><option value="archived">Archived</option></select></div><div class="faq-admin-loading" id="faqAdminLoading">Loading FAQs...</div><div class="faq-admin-rows" id="faqAdminRows"></div><div class="faq-admin-empty" id="faqAdminEmpty" hidden>No FAQs match the selected filters.</div></div>
    </section></main></div>
  <div class="faq-modal" id="faqEditor" aria-hidden="true"><div class="faq-modal-card" role="dialog" aria-modal="true" aria-labelledby="faqEditorTitle"><div class="faq-modal-header"><h2 id="faqEditorTitle">Create FAQ</h2><button type="button" class="faq-close" id="faqEditorClose" aria-label="Close">×</button></div><form class="faq-form" id="faqForm"><div class="faq-form-grid"><div class="faq-field full"><label for="faqQuestion">Question</label><input id="faqQuestion" required></div><div class="faq-field"><label for="faqSlug">URL Slug</label><input id="faqSlug" placeholder="Generated from question"></div><div class="faq-field"><label for="faqCategory">Category</label><input id="faqCategory" list="faqCategoryOptions" required><datalist id="faqCategoryOptions"><option value="Ordering"><option value="Collection Sites"><option value="Results"><option value="DOT Testing"><option value="Employer Services"><option value="Training"><option value="Support"></datalist></div><div class="faq-field full"><label for="faqAnswer">Answer (basic HTML allowed)</label><textarea id="faqAnswer" required placeholder="<p>Enter the answer...</p>"></textarea></div><div class="faq-field"><label for="faqTags">Tags</label><input id="faqTags" placeholder="DOT, testing, results"></div><div class="faq-field"><label for="faqStatus">Status</label><select id="faqStatus"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option><option value="archived">Archived</option></select></div><div class="faq-field"><label for="faqSortOrder">Sort Order</label><input id="faqSortOrder" type="number" min="0" step="1"></div><div class="faq-field full"><label>Visibility</label><div class="faq-checks"><label><input id="faqFeatured" type="checkbox"> Featured</label><label><input id="faqShowWebsite" type="checkbox"> Website</label><label><input id="faqShowCustomer" type="checkbox"> Customer Portal</label><label><input id="faqShowEmployer" type="checkbox"> Employer Portal</label></div></div></div><div class="faq-modal-actions"><button type="button" class="faq-cancel" id="faqEditorCancel">Cancel</button><button type="submit" class="faq-primary" id="faqSaveButton">Save FAQ</button></div></form></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core-auth.js"></script><script src="assets/js/ui.js"></script><script src="assets/js/session-security.js"></script><script src="assets/js/portal-auth-guard.js"></script><script src="assets/js/admin-auth-guard.js"></script><script src="assets/js/admin-lms-sidebar.js"></script><script src="assets/js/admin-faqs.js"></script>
</body>
</html>
