<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing | screenings4u</title><link rel="stylesheet" href="assets/css/admin-core.css"><link rel="stylesheet" href="assets/css-commerce.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/ui.js"></script><script src="assets/js/commerce.js"></script></head><body><div class="s4u-app"><aside class="s4u-sidebar"><div class="s4u-sidebar-inner"><div class="s4u-brand"><img src="images/logo.png" alt="screenings4u"><div><strong>CLIENT PORTAL</strong><span>screenings4u</span></div></div><nav class="s4u-nav"><div class="s4u-nav-section">Account</div><a class="s4u-nav-link" href="client-dashboard.html">▦ <span>Dashboard</span></a><a class="s4u-nav-link active" href="client-billing.html">$ <span>Billing</span></a><a class="s4u-nav-link" href="client-orders.html">▤ <span>Orders</span></a><a class="s4u-nav-link" href="client-proposals.html">▱ <span>Proposals</span></a></nav><div class="s4u-sidebar-footer"><button class="s4u-nav-link" id="logoutButton">↪ <span>Sign Out</span></button></div></div></aside><main class="s4u-main"><header class="s4u-topbar"><strong>Billing</strong></header><div class="s4u-content"><header class="s4u-page-header"><div><div class="s4u-page-kicker">CLIENT PORTAL / BILLING</div><h1>Billing</h1><p>View invoices, balances, and payment history for your organization.</p></div></header><section class="s4u-section"><div class="s4u-section-body"><div class="s4u-table-wrap"><table class="s4u-table"><thead><tr><th>Invoice</th><th>Status</th><th>Due</th><th>Total</th><th>Balance</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading billing…</td></tr></tbody></table></div></div></section></div></main></div><script>
(async()=>{try{const session=await S4UAuth.requireSession('client-login.html');if(!session)return;const rows=document.getElementById('rows');const {data,error}=await S4UAuth.getClient().from('invoices').select('invoice_number,status,due_date,total,amount_due,currency').order('created_at',{ascending:false});if(error)throw error;rows.innerHTML=(data||[]).length?data.map(x=>`<tr><td><strong>${x.invoice_number}</strong></td><td>${x.status}</td><td>${x.due_date||'—'}</td><td>${x.currency} ${Number(x.total||0).toFixed(2)}</td><td>${x.currency} ${Number(x.amount_due||0).toFixed(2)}</td></tr>`).join(''):`<tr><td colspan="5" class="s4u-empty">No invoices are available.</td></tr>`;document.getElementById('logoutButton').onclick=()=>S4UAuth.signOut()}catch(e){console.error(e);window.S4UUI.toast(e.message||'Unable to load billing.','error')}})();</script></body></html>
