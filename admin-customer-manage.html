atus{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:900}.customer-status.active{background:#eaf7f0;color:#16804d}.customer-status.inactive{background:#fff2e8;color:#f05a00}.customer-manage-link{border:1px solid #cbd7e5;border-radius:7px;padding:7px 10px;color:#173d78;text-decoration:none;font-size:10px;font-weight:800}.customer-side-column{min-width:0;display:grid;grid-template-rows:auto auto;gap:16px}.customer-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px}.customer-action{min-height:112px;display:flex;flex-direction:column;justify-content:center;padding:13px;border:1px solid #dfe5ed;border-radius:8px;background:#fff;color:inherit;text-decoration:none}.customer-action:hover{background:#f8fafc;border-color:#c8d5e4}.customer-action-icon{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#edf4fc;color:#17519b}.customer-action strong{display:block;margin-top:10px;color:#173d78;font-size:12px}.customer-action small{display:block;margin-top:5px;color:#647189;font-size:10px}.customer-resource-list{padding:7px 13px 12px}.customer-resource-row{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid #edf0f4}.customer-resource-row:last-child{border-bottom:0}.customer-resource-row strong{display:block;color:#173d78;font-size:11px}.customer-resource-row small{display:block;margin-top:4px;color:#647189;font-size:10px}.customer-form-page{max-width:1050px}.customer-form-card{margin-top:16px}.customer-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:22px 23px}.customer-field{display:grid;gap:7px}.customer-field.full{grid-column:1/-1}.customer-field label{color:#52627a;font-size:10px;font-weight:900;letter-spacing:.045em}.customer-field input,.customer-field select,.customer-field textarea{width:100%;box-sizing:border-box;border:1px solid #d6e0ea;border-radius:8px;padding:11px 12px;color:#24364f;background:#fff;font:inherit;font-size:12px}.customer-field textarea{min-height:120px}.customer-form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.customer-form-actions .s4u-button{min-width:130px;height:43px;border-radius:9px;font-size:11px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.customer-page-notice{display:none;margin-top:16px;padding:12px 15px;border:1px solid #b9e2ca;border-radius:8px;background:#eaf7f0;color:#16804d;font-size:11px;font-weight:800}@media(max-width:1050px){.customer-main-grid{grid-template-columns:1fr}.customer-side-column{grid-template-columns:1fr 1fr;grid-template-rows:auto}.customer-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.customer-page{padding:18px 14px 22px}.customer-page-header{min-height:0;align-items:flex-start;flex-direction:column}.customer-page-actions{width:100%}.customer-page-actions .s4u-button{flex:1}.customer-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.customer-kpi-card{min-height:128px;padding:14px}.customer-main-grid .s4u-section-header{align-items:flex-start;flex-direction:column;padding-left:17px;padding-right:17px}.customer-section-tools{width:100%}.customer-search{width:100%}.customer-side-column{grid-template-columns:1fr}.customer-action-grid{grid-template-columns:1fr}.customer-form-grid{grid-template-columns:1fr}.customer-field.full{grid-column:auto}.customer-form-actions{flex-direction:column-reverse}.customer-form-actions .s4u-button{width:100%}}@media(max-width:430px){.customer-kpi-grid{grid-template-columns:1fr}}
</style></head><body><div class="s4u-app"><nav class="s4u-nav" id="adminNavigation"></nav><main class="s4u-main"><div class="customer-page customer-form-page"><header class="customer-page-header"><div class="customer-page-heading"><div class="s4u-page-kicker">CUSTOMER MANAGEMENT</div><h1 id="pageTitle">Manage Customer</h1><p>Review and update the selected customer record from this dedicated page.</p></div><div class="customer-page-actions"><a class="s4u-button" href="admin-customers.html">Back to Customers</a></div></header><div class="customer-page-notice" id="notice"></div><form id="customerForm"><article class="customer-form-card"><header class="s4u-section-header"><div><h2>Customer Information</h2><p>Maintain the customer account and contact information.</p></div></header><div class="customer-form-grid"><div class="customer-field"><label>FIRST NAME</label><input id="firstName"></div><div class="customer-field"><label>LAST NAME</label><input id="lastName"></div><div class="customer-field full"><label>COMPANY NAME</label><input id="companyName"></div><div class="customer-field"><label>EMAIL</label><input id="email" type="email"></div><div class="customer-field"><label>PHONE</label><input id="phone"></div><div class="customer-field"><label>STATUS</label><select id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div></article><div class="customer-form-actions"><a class="s4u-button" href="admin-customers.html">Cancel</a><button class="s4u-button customer-primary-button" id="saveBtn">Save Changes</button></div></form></div></main></div><script src="assets/js/admin-navigation.js"></script><script>(async()=>{const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("id");if(!id){location.href="admin-customers.html";return}const c=window.S4UAuth?.getClient?.()||window.supabaseClient;if(!c)return;const r=await c.from("client_profiles").select("*").eq("id",id).single();if(r.error){alert(r.error.message);return}const d=r.data;$("pageTitle").textContent="Manage "+(d.full_name||d.company_name||"Customer");$("firstName").value=d.first_name||"";$("lastName").value=d.last_name||"";$("companyName").value=d.company_name||"";$("email").value=d.email||"";$("phone").value=d.phone||"";$("status").value=d.status||(d.is_active===false?"inactive":"active");if(new URLSearchParams(location.search).get("created")==="1"){$("notice").textContent="Customer created successfully.";$("notice").style.display="block"}$("customerForm").onsubmit=async e=>{e.preventDefault();const st=$("status").value,p={first_name:$("firstName").value.trim()||null,last_name:$("lastName").value.trim()||null,company_name:$("companyName").value.trim()||null,email:$("email").value.trim()||null,phone:$("phone").value.trim()||null,status:st,is_active:st==="active"};$("saveBtn").disabled=true;const u=await c.from("client_profiles").update(p).eq("id",id);if(u.error)alert(u.error.message);else{$("notice").textContent="Customer saved successfully.";$("notice").style.display="block";scrollTo({top:0,behavior:"smooth"})}$("saveBtn").disabled=false}})();</script></body></html>
